# Production stack: FrankenPHP (PHP app + Caddy web server) + PostgreSQL
# Usage: docker compose -f compose.prod.yaml up -d --build --wait
services:
  php:
    image: conventio2-php
    build:
      context: .
      target: frankenphp_prod
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SERVER_NAME: \${SERVER_NAME:-localhost}, php:80
      DEFAULT_URI: \${DEFAULT_URI:-https://\${SERVER_NAME:-localhost}}
      APP_SECRET: \${APP_SECRET:-}
      DATABASE_URL: postgresql://\${POSTGRES_USER:-app}:\${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/\${POSTGRES_DB:-app}?serverVersion=\${POSTGRES_VERSION:-16}&charset=utf8
      # Uncomment and set on the server if you send real emails
      # MAILER_DSN: smtp://user:pass@smtp.example.fr:587
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - app_share:/app/var/share
    ports:
      - name: http
        target: 80
        published: \${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: \${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        target: 443
        published: \${HTTPS_PORT:-443}
        protocol: udp

  database:
    image: postgres:\${POSTGRES_VERSION:-16}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: \${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: \${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: \${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "\${POSTGRES_DB:-app}", "-U", "\${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw

volumes:
  caddy_data:
  caddy_config:
  app_share:
  database_data:
